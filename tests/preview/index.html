<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Language Pack — local regression fixture</title>
<style>
:root {--foreground:#1c2633;--background:#fff;--border:#dce1e8;--muted:#eef1f5;--muted-foreground:#607084;--accent:#e8f1fd;font:15px system-ui;color:var(--foreground);background:#f5f7fa}
*{box-sizing:border-box}body{margin:0}main{max-width:1060px;margin:24px auto;padding:24px;background:#fff;border:1px solid var(--border);border-radius:12px}header{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:24px}h2{font-size:18px}nav{display:flex;gap:20px;border-block:1px solid var(--border);padding:16px 0;margin:16px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}section{padding:16px;border:1px solid var(--border);border-radius:8px}.grid>section:first-child label{display:block;margin:14px 0}input:not([type="radio"]),textarea{display:block;width:100%;padding:10px;border:1px solid var(--border);border-radius:6px;font:inherit;margin-top:8px}button{padding:8px 12px;border:1px solid var(--border);border-radius:6px;background:var(--muted);cursor:pointer;margin:4px 4px 4px 0}.status{padding:4px 10px;background:var(--accent);border-radius:10px}pre{background:#f4f6f9;padding:12px}small{color:var(--muted-foreground)}[contenteditable]{padding:10px;border:1px dashed var(--border)}@media(max-width:760px){.grid{grid-template-columns:1fr}main{margin:8px}nav{flex-wrap:wrap}}
</style>
</head>
<body><div id="root"></div><script type="module" src="/preview.js"></script></body>
</html>
